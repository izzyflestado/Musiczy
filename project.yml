# XcodeGen spec: run `xcodegen generate` in this folder to create Musiczy.xcodeproj.
# (Install XcodeGen with `brew install xcodegen`.)
name: Musiczy

options:
  bundleIdPrefix: com.izzyflestado
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    branch: master            # the repo has no version tags
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    from: 1.0.0

targets:
  Musiczy:
    type: application
    platform: macOS
    sources:
      - path: Musiczy
        excludes:
          - Info.plist
          - Musiczy.entitlements
    dependencies:
      - package: MediaRemoteAdapter
      - package: SkyLightWindow
    settings:
      base:
        PRODUCT_NAME: Musiczy
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyflestado.musiczy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"          # the code is written for Swift 5 language mode
        INFOPLIST_FILE: Musiczy/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Musiczy/Musiczy.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO        # must stay off (AppleScript, mdfind, reading local files)
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
